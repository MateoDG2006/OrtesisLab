name: pruebas

on:
  push:
  pull_request:

jobs:
  unitarias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff
      - name: unittest
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: ruff
        run: ruff check .
      - name: compileall
        run: python -m compileall -q .
