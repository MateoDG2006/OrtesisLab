name: pruebas

on:
  push:
  pull_request:

jobs:
  unitarias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Dependencias
        run: uv sync --locked --all-groups
      - name: Humo de importación
        run: uv run python -m unittest tests.aplicacion_web.test_humo_import -v
      - name: unittest
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v
      - name: Índices documentales
        run: uv run python docs/Agents/Scripts/GenerarIndices.py --comprobar
      - name: ruff (errores graves; el resto es deuda progresiva)
        run: uv run ruff check . --select E9,F63,F7,F82
      - name: compileall
        run: uv run python -m compileall -q .

  persistencia:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ortesislab_admin
          POSTGRES_PASSWORD: cambie-admin
          POSTGRES_DB: ortesislab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      ORTESISLAB_TEST_MIGRATOR_DATABASE_URL: postgresql+psycopg://ortesislab_migrator:cambie-migrador@127.0.0.1:5432/ortesislab_test
      ORTESISLAB_TEST_DATABASE_URL: postgresql+psycopg://ortesislab_app:cambie-app@127.0.0.1:5432/ortesislab_test
      ORTESISLAB_TEST_WORKER_DATABASE_URL: postgresql+psycopg://ortesislab_worker:cambie-trabajador@127.0.0.1:5432/ortesislab_test
      ORTESISLAB_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Dependencias
        run: uv sync --locked --all-groups
      - name: Roles PostgreSQL
        env:
          PGPASSWORD: cambie-admin
        run: |
          psql -h 127.0.0.1 -U ortesislab_admin -d ortesislab_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ortesislab_migrator LOGIN PASSWORD 'cambie-migrador';
          CREATE ROLE ortesislab_app LOGIN PASSWORD 'cambie-app';
          CREATE ROLE ortesislab_worker LOGIN PASSWORD 'cambie-trabajador';
          CREATE ROLE ortesislab_backup LOGIN PASSWORD 'cambie-backup';
          ALTER ROLE ortesislab_migrator SET search_path = ortesislab;
          ALTER ROLE ortesislab_app SET search_path = ortesislab;
          ALTER ROLE ortesislab_worker SET search_path = ortesislab;
          ALTER ROLE ortesislab_backup SET search_path = ortesislab;
          SQL
      - name: Preparar base vacía
        env:
          PGPASSWORD: cambie-admin
        run: |
          psql -h 127.0.0.1 -U ortesislab_admin -d ortesislab_test -v ON_ERROR_STOP=1 -v base=ortesislab_test -f db/test/preparar_base.sql
      - name: Alembic upgrade
        run: uv run alembic -x base=test upgrade head
