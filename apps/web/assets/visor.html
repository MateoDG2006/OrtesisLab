<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Vista previa</title>
  <style>
    html, body { margin: 0; height: 100%; background: #eef1f4; color: #1c2024; font-family: sans-serif; }
    canvas { display: block; }
    p { margin: 1.5rem; max-width: 40rem; line-height: 1.45; }
    p.error { color: #8b1e1e; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from "/vendor/three-0.169.0.module.js";

const LIMITE_BYTES = 64 * 1024 * 1024;
const aviso = document.createElement("p");
document.body.append(aviso);

function mostrarError(texto) {
  aviso.textContent = texto;
  aviso.classList.add("error");
}

function origenPermitido(url) {
  try {
    const parsed = new URL(url, location.origin);
    if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
      return false;
    }
    if (parsed.origin === location.origin) {
      return true;
    }
    return /\/usuarios\/[0-9a-f-]{36}\/assets\/[0-9a-f-]{36}\.stl(?:\?|$)/i.test(parsed.pathname + parsed.search);
  } catch {
    return false;
  }
}

const origenParam = new URLSearchParams(location.search).get("src");
// Miniatura: un solo fotograma convertido en imagen; libera el contexto WebGL (el navegador limita cuántos hay).
const miniatura = new URLSearchParams(location.search).get("miniatura") === "1";
if (!origenParam) {
  mostrarError("Genere una ortesis para verla aquí.");
  throw new Error("sin malla");
}
if (!origenPermitido(origenParam)) {
  mostrarError("La URL de la malla no está permitida.");
  throw new Error("origen rechazado");
}

const controlador = new AbortController();
const temporizador = setTimeout(() => controlador.abort(), 120000);
aviso.textContent = "Cargando malla…";

let respuesta;
try {
  respuesta = await fetch(origenParam, { signal: controlador.signal });
} catch (error) {
  mostrarError(controlador.signal.aborted ? "La descarga tardó demasiado." : "No se pudo contactar con el almacén de archivos.");
  throw error;
} finally {
  clearTimeout(temporizador);
}

if (!respuesta.ok) {
  mostrarError(
    respuesta.status === 404 || respuesta.status === 403
      ? "El STL ya no está en el almacén. Vuelva a generar esta variante."
      : "No se pudo leer la malla generada.",
  );
  throw new Error(String(respuesta.status));
}

const longitud = Number(respuesta.headers.get("content-length") || 0);
if (longitud > LIMITE_BYTES) {
  mostrarError("El archivo supera el tamaño máximo permitido para la vista previa.");
  throw new Error("demasiado grande");
}

const buffer = await respuesta.arrayBuffer();
if (buffer.byteLength > LIMITE_BYTES) {
  mostrarError("El archivo supera el tamaño máximo permitido para la vista previa.");
  throw new Error("demasiado grande");
}
if (buffer.byteLength < 84) {
  mostrarError("El archivo no parece un STL binario válido.");
  throw new Error("stl corto");
}

function geometria(buf) {
  const vista = new DataView(buf);
  const caras = vista.getUint32(80, true);
  const bytesNecesarios = 84 + caras * 50;
  if (bytesNecesarios > buf.byteLength) {
    throw new Error("cabecera STL inconsistente");
  }
  const posiciones = new Float32Array(caras * 9);
  let cursor = 84;
  let escrito = 0;
  for (let cara = 0; cara < caras; cara += 1) {
    cursor += 12;
    for (let componente = 0; componente < 9; componente += 1) {
      posiciones[escrito] = vista.getFloat32(cursor, true);
      escrito += 1;
      cursor += 4;
    }
    cursor += 2;
  }
  const malla = new THREE.BufferGeometry();
  malla.setAttribute("position", new THREE.BufferAttribute(posiciones, 3));
  malla.computeVertexNormals();
  malla.computeBoundingSphere();
  return malla;
}

let malla;
try {
  malla = geometria(buffer);
} catch (error) {
  mostrarError("El STL no se pudo interpretar.");
  throw error;
}

aviso.remove();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f4);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 5000);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
scene.add(new THREE.HemisphereLight(0xffffff, 0x8b95a1, 0.45));
const luz = new THREE.DirectionalLight(0xffffff, 1.15);
luz.position.set(0.6, 1, 1.4);
scene.add(luz);

const objetivo = new THREE.Vector3();
let arrastre = false;
let anterior = { x: 0, y: 0 };
const esferica = { radio: 1, theta: 0.6, phi: 1.05 };

const material = new THREE.MeshStandardMaterial({
  color: 0xd5dbe3,
  metalness: 0.04,
  roughness: 0.62,
  side: THREE.DoubleSide,
});
scene.add(new THREE.Mesh(malla, material));
const esfera = malla.boundingSphere;
objetivo.copy(esfera.center);
esferica.radio = Math.max(esfera.radius * 2.4, 1);
camera.near = esfera.radius / 100;
camera.far = esfera.radius * 30;
camera.updateProjectionMatrix();

function encuadrar() {
  const desplazamiento = new THREE.Vector3(
    Math.sin(esferica.phi) * Math.cos(esferica.theta),
    Math.cos(esferica.phi),
    Math.sin(esferica.phi) * Math.sin(esferica.theta),
  ).multiplyScalar(esferica.radio);
  camera.position.copy(objetivo).add(desplazamiento);
  camera.lookAt(objetivo);
}
encuadrar();

if (miniatura) {
  renderer.render(scene, camera);
  const imagen = new Image();
  imagen.alt = "Miniatura de la ortesis";
  imagen.src = renderer.domElement.toDataURL("image/png");
  imagen.style.cssText = "display:block;width:100%;height:100%;object-fit:contain";
  renderer.domElement.replaceWith(imagen);
  renderer.dispose();
  renderer.forceContextLoss();
}

renderer.domElement.addEventListener("pointerdown", (evento) => {
  arrastre = true;
  anterior = { x: evento.clientX, y: evento.clientY };
});
addEventListener("pointerup", () => { arrastre = false; });
addEventListener("pointermove", (evento) => {
  if (!arrastre) return;
  esferica.theta += (evento.clientX - anterior.x) * 0.008;
  esferica.phi = Math.min(Math.max(esferica.phi + (evento.clientY - anterior.y) * 0.008, 0.15), Math.PI - 0.15);
  anterior = { x: evento.clientX, y: evento.clientY };
  encuadrar();
});
renderer.domElement.addEventListener("wheel", (evento) => {
  evento.preventDefault();
  esferica.radio = Math.min(
    Math.max(esferica.radio * (evento.deltaY > 0 ? 1.08 : 0.92), esfera.radius * 0.4),
    esfera.radius * 12,
  );
  encuadrar();
}, { passive: false });

addEventListener("keydown", (evento) => {
  const paso = evento.shiftKey ? 0.03 : 0.01;
  switch (evento.key) {
    case "ArrowLeft":
      esferica.theta -= paso;
      break;
    case "ArrowRight":
      esferica.theta += paso;
      break;
    case "ArrowUp":
      esferica.phi = Math.max(esferica.phi - paso, 0.15);
      break;
    case "ArrowDown":
      esferica.phi = Math.min(esferica.phi + paso, Math.PI - 0.15);
      break;
    case "+":
    case "=":
      esferica.radio = Math.max(esferica.radio * 0.92, esfera.radius * 0.4);
      break;
    case "-":
    case "_":
      esferica.radio = Math.min(esferica.radio * 1.08, esfera.radius * 12);
      break;
    default:
      return;
  }
  evento.preventDefault();
  encuadrar();
});

addEventListener("resize", () => {
  if (miniatura) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function dibujar() {
  requestAnimationFrame(dibujar);
  renderer.render(scene, camera);
}
if (!miniatura) {
  dibujar();
}
</script>
</body>
</html>
