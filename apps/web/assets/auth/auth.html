<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{titulo}} · OrtesisLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>{{estilos}}</style>
</head>
<body>
<main class="ol-shell">
  <p class="ol-brand">OrtesisLab</p>
  <div class="ol-card">
    <h1>{{titulo}}</h1>
    <p class="ol-lead">Acceda para guardar superficies, lotes e historial.</p>
    {{aviso}}
    <form method="post" action="{{accion}}">
      <label>Usuario <input name="usuario" autocomplete="username" required></label>
      <label>Contraseña <input name="password" type="password" autocomplete="{{autocomplete_password}}" required></label>
      <button type="submit">{{titulo}}</button>
    </form>
    <p class="ol-foot">{{enlace}}</p>
  </div>
</main>
</body>
</html>
