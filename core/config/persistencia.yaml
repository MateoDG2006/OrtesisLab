# PostgreSQL, lotes e historial. Leído por web/ConfiguracionBackend.py.

conexion:
  # Reintentos de una transacción ante deadlock o fallo de serialización.
  reintentos: 3
  # Pausa antes del reintento n: pausa_reintento_s * n.
  pausa_reintento_s: 0.05
  # Espera máxima por una conexión libre del pool.
  espera_adquisicion_s: 5.0
  # Espera máxima al abrir una conexión nueva con PostgreSQL.
  timeout_conexion_s: 10

lotes:
  maximo_pendientes: 3
  maximo_intentos: 3
  # Espera antes del reintento n de un ítem: espera_reintento_s * 2^(n-1).
  espera_reintento_s: 5.0

historial:
  limite_defecto: 25
  limite_maximo: 100
  maximo_comparacion: 3

# Cuotas por usuario (comprobadas bajo advisory lock en importación).
cuotas:
  max_bytes_usuario: 1073741824
  max_imports_ready: 100
  max_subidas_por_hora: 30

# Purga periódica (job del conciliador). Borrado de cuenta: futuro.
retencion:
  sesiones_dias: 90
  eventos_historial_dias: 730
  imports_ready_dias: 0
