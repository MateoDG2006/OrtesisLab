[project]
name = "generatemodelsapp"
version = "0.1.0"
description = "OrtesisLab: aplicación Reflex y núcleo geométrico para ortesis paramétricas"
readme = "README.md"
authors = [
    { name = "Mateo Del Giudice", email = "mateodelgiudice5@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "boto3>=1.40",
    "itsdangerous>=2.2",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "redis>=7.0",
    "reflex>=0.9.12",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "moto[server]>=5.1",
    "ruff>=0.9",
]

[project.scripts]
ortesislab = "OrtesisLabPlugin.consola:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[server]>=5.1",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["N802"]
